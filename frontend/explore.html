<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Stories - EchoTales</title>
    <meta name="description" content="Discover captivating tales that will transport you to new worlds at EchoTales">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Core colors - Vibrant storytelling palette */
            --background: hsl(0, 0%, 8%);
                --foreground: hsl(250, 40%, 95%);
                --card: hsl(0, 0%, 12%);
                --card-foreground: hsl(250, 40%, 95%);
                --primary: hsl(250, 40%, 95%);
                --primary-foreground: hsl(0, 0%, 8%);
                --secondary: hsl(0, 0%, 15%);
                --secondary-foreground: hsl(250, 40%, 95%);
                --muted: hsl(180,50%,25%);
                --muted-foreground: hsl(0, 0%, 65%);
                --accent: hsl(180, 50%, 25%);
                --accent-foreground: hsl(250, 40%, 95%);
                --border: hsl(0, 0%, 18%);
                --input: hsl(0, 0%, 18%);
                --ring: hsl(250, 40%, 95%);
            
            /* Sidebar colors */
            --sidebar-background: hsl(0, 0%, 10%);
                --sidebar-foreground: hsl(250, 40%, 90%);
                --sidebar-border: hsl(0, 0%, 15%);
                --sidebar-accent: hsl(0, 0%, 15%);
                --sidebar-accent-foreground: hsl(250, 40%, 95%);

            --radius: 12px;
            --gradient-text: linear-gradient(135deg, hsl(250, 40%, 95%) 0%, hsl(35, 85%, 55%) 50%, hsl(180, 80%, 55%) 100%);
                --shadow-elegant: 0 10px 50px -10px hsl(0, 0%, 0%, 0.4);
                --shadow-soft: 0 4px 20px -4px hsl(0, 0%, 0%, 0.25);
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 300;
            line-height: 1.6;
            background: linear-gradient(to bottom, var(--background));
            color: var(--foreground);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 256px;
            background-color: var(--sidebar-background);
            border-right: 1px solid var(--sidebar-border);
            padding-top: 80px;
            transition: var(--transition-smooth);
            z-index: 30;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: hsl(from var(--sidebar-foreground) h s l / 0.7);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .nav-item:hover {
            background-color: var(--sidebar-accent);
            color: var(--sidebar-foreground);
        }

        .nav-item.active {
            background-color: var(--sidebar-accent);
            color: var(--sidebar-accent-foreground);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
        }

        /* Header */
        .header {
            position: fixed;
            left: 256px;
            right: 0;
            top: 0;
            z-index: 40;
            background-color: hsl(from var(--background) h s l / 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid hsl(from var(--border) h s l / 0.5);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            padding: 0 32px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-dot {
            width: 16px;
            height: 16px;
            background-color: var(--primary-foreground);
            border-radius: 50%;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: -0.025em;
        }

        /* Profile Dropdown */
        .profile-dropdown {
            position: relative;
        }

        .profile-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary);
            color: var(--primary-foreground);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 500;
            transition: var(--transition-smooth);
        }

        .profile-button:hover {
            transform: scale(1.05);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-elegant);
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
            z-index: 50;
            overflow: hidden;
        }

        .dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--foreground);
            text-decoration: none;
            font-size: 0.875rem;
            transition: var(--transition-smooth);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .dropdown-item:hover {
            background-color: var(--muted);
        }

        .dropdown-icon {
            width: 16px;
            height: 16px;
        }

        /* Main Content */
        .main-content {
            margin-left: 256px;
            padding-top: 64px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 48px 32px;
        }

        .page-header {
            margin-bottom: 48px;
        }

        .page-title {
            font-size: clamp(2.5rem, 5vw, 3rem);
            font-weight: 300;
            letter-spacing: -0.025em;
            margin-bottom: 16px;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }

        .page-description {
            font-size: 1.25rem;
            color: var(--muted-foreground);
        }

        /* Search Bar */
        .search-section {
            margin-bottom: 48px;
        }

        .search-container {
            position: relative;
            margin-bottom: 16px;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--muted-foreground);
        }

        .search-input {
            width: 100%;
            height: 56px;
            padding-left: 48px;
            padding-right: 16px;
            font-size: 1rem;
            background-color: hsl(from var(--card) h s l / 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid hsl(from var(--border) h s l / 0.5);
            border-radius: var(--radius);
            color: var(--foreground);
            box-shadow: var(--shadow-soft);
            transition: var(--transition-smooth);
            font-family: 'Inter', sans-serif;
        }

        .search-input:focus {
            outline: none;
            box-shadow: var(--shadow-elegant);
            border-color: var(--ring);
        }

        .search-input::placeholder {
            color: var(--muted-foreground);
        }

        /* Tags */
        .tags-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .tags-container::-webkit-scrollbar {
            display: none;
        }

        .tag {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: 1px solid var(--border);
            background-color: var(--background);
            color: var(--foreground);
        }

        .tag:hover {
            background-color: var(--muted);
        }

        .tag.active {
            background-color: var(--primary);
            color: var(--primary-foreground);
            border-color: var(--primary);
        }

        /* Stories Grid */
        .stories-grid {
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }

        .story-card {
            background-color: hsl(from var(--card) h s l / 0.8);
            backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid hsl(from var(--border) h s l / 0.5);
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-soft);
        }

        .story-card:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-elegant);
        }

        .story-card-header {
            margin-bottom: 16px;
        }

        .story-title {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
            transition: var(--transition-smooth);
        }

        .story-card:hover .story-title {
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .story-author {
            color: var(--muted-foreground);
            font-size: 0.875rem;
        }

        .story-card-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .story-excerpt {
            color: hsl(from var(--foreground) h s l / 0.8);
            line-height: 1.5;
            font-size: 0.875rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .story-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--muted-foreground);
        }

        .story-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .story-buttons {
            display: flex;
            gap: 8px;
            padding-top: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-decoration: none;
            text-align: center;
            font-family: 'Inter', sans-serif;
        }

        .btn-outline {
            background-color: var(--background);
            color: var(--foreground);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background-color: var(--muted);
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--primary-foreground);
        }

        .btn-primary:hover {
            transform: scale(1.05);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 24px;
            box-shadow: var(--shadow-elegant);
            z-index: 200;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            min-width: 300px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-title {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .toast-description {
            font-size: 0.875rem;
            color: var(--muted-foreground);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .header {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .stories-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 32px 16px;
            }
        }
    </style>
</head>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <div class="logo-dot"></div>
                </div>
                <span class="logo-text">EchoTales</span>
            </div>

            <div class="profile-dropdown">
                <button class="profile-button" onclick="toggleProfileDropdown()">
                    U
                </button>

                    </button>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">Explore Stories</h1>
                <p class="page-description">Discover captivating tales that will transport you to new worlds</p>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <div class="search-container">
                    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input 
                        type="text" 
                        class="search-input" 
                        placeholder="Search for stories..." 
                        id="searchInput"
                        oninput="handleSearch()"
                    >
                </div>

                <div class="tags-container" id="tagsContainer">
                    <div class="tag active" onclick="selectTag(this)">All Stories</div>
                    <div class="tag" onclick="selectTag(this)">Sci-Fi</div>
                    <div class="tag" onclick="selectTag(this)">Fantasy</div>
                    <div class="tag" onclick="selectTag(this)">Mystery</div>
                    <div class="tag" onclick="selectTag(this)">Romance</div>
                    <div class="tag" onclick="selectTag(this)">Thriller</div>
                    <div class="tag" onclick="selectTag(this)">Adventure</div>
                    <div class="tag" onclick="selectTag(this)">Horror</div>
                </div>
            </div>

            <div class="stories-grid" id="storiesGrid">
                <!-- Stories will be dynamically inserted here -->
            </div>
        </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div class="toast-title" id="toastTitle"></div>
        <div class="toast-description" id="toastDescription"></div>
    </div>

    <script>
        //stories
        let stories=[];
        // Render stories
        function renderStories(storiesToRender) {
            const grid = document.getElementById('storiesGrid');
            grid.innerHTML = storiesToRender.map(story => `
                <div class="story-card">
                    <div class="story-card-header">
                        <h3 class="story-title">${story.title}</h3>
                        <p class="story-author">by ${story.authorName}</p>
                    </div>
                    <div class="story-card-content">
                        <p class="story-excerpt">${story.content.substring(0, 150)}..</p>
                        <div class="story-meta">
                            <span class="story-meta-item">
                                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                                </svg>
                                ${story.readTime} min
                            </span>
                            <span class="story-meta-item">
                                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                                </svg>
                                ${story.listenTime} min
                            </span>
                        </div>
                        <div class="story-buttons">
                            <button class="btn btn-outline" onclick="window.location.href='/read/${story._id}'">Read</button>
                            <button class="btn btn-primary" onclick="window.location.href='/listen/${story._id}'">Listen</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Initial render
        window.addEventListener('DOMContentLoaded', fetchStories);

        async function fetchStories() {
    try {
        const res = await fetch('/stories');
        if (!res.ok) throw new Error('Failed to fetch stories');
         stories = await res.json();
        renderStories(stories);
    } catch (err) {
        console.error(err);
        showToast('Error', 'Unable to load stories.');
    }
}

        // Tag selection
        function selectTag(element) {
  document.querySelectorAll('.tag').forEach(tag => tag.classList.remove('active'));
  element.classList.add('active');

  const selectedGenre = element.textContent;
  let filteredStories;

  if (selectedGenre === 'All Stories') {
    filteredStories = stories;
  } else {
    filteredStories = stories.filter(story => 
      story.genres && story.genres.some(g => g.toLowerCase() === selectedGenre.toLowerCase())
    );
  }

  renderStories(filteredStories);
  showToast('Filter Applied', `Showing ${selectedGenre} stories`);
}

        // Search functionality
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filteredStories = stories.filter(story => 
                story.title.toLowerCase().includes(query) ||
                story.authorName.toLowerCase().includes(query) ||
                story.content.toLowerCase().includes(query)
            );
            renderStories(filteredStories);
        }

        // Profile Dropdown
        function toggleProfileDropdown() {
            const dropdown = document.getElementById('profileDropdown');
            dropdown.classList.toggle('active');
        }

        function viewProfile() {
            showToast('Profile', 'Navigating to your profile...');
            toggleProfileDropdown();
            window.location.href = '/profile';
        }

        async function logout() {
            try{
                const res = await fetch('/logout', {
                method: 'GET',
                credentials: 'include'
                });
                if (res.ok) {
                    showToast('Logged Out','You have been successfully logged out.');
                    toggleProfileDropdown();
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                }
                } catch (err) {
                        showToast('Error','Something went wrong while logging out.');
                    }
        }
        // Toast Notification
        function showToast(title, description) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toastTitle');
            const toastDescription = document.getElementById('toastDescription');
            
            toastTitle.textContent = title;
            toastDescription.textContent = description;
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('profileDropdown');
            const profileButton = document.querySelector('.profile-button');
            
            if (!profileButton.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.classList.remove('active');
            }
        });

        // Close dropdown with Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                document.getElementById('profileDropdown').classList.remove('active');
            }
        });
    </script>
</body>
</html>
