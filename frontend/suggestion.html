<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggestions - EchoTales</title>
    <meta name="description" content="Personalized story recommendations based on your reading preferences">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: hsl(0, 0%, 8%);
            --foreground: hsl(250, 40%, 95%);
            --card: hsl(0, 0%, 12%);
            --card-foreground: hsl(250, 40%, 95%);
            --primary: hsl(250, 40%, 95%);
            --primary-foreground: hsl(0, 0%, 8%);
            --secondary: hsl(0, 0%, 15%);
            --secondary-foreground: hsl(250, 40%, 95%);
            --muted: hsl(180, 50%, 25%);
            --muted-foreground: hsl(0, 0%, 65%);
            --accent: hsl(180, 50%, 25%);
            --accent-foreground: hsl(250, 40%, 95%);
            --border: hsl(0, 0%, 18%);
            --sidebar-background: hsl(0, 0%, 10%);
            --sidebar-foreground: hsl(250, 40%, 90%);
            --sidebar-border: hsl(0, 0%, 15%);
            --sidebar-accent: hsl(0, 0%, 15%);
            --sidebar-accent-foreground: hsl(250, 40%, 95%);
            --radius: 12px;
            --gradient-text: linear-gradient(135deg, hsl(250, 40%, 95%) 0%, hsl(35, 85%, 55%) 50%, hsl(180, 80%, 55%) 100%);
            --shadow-elegant: 0 10px 50px -10px hsl(0, 0%, 0%, 0.4);
            --shadow-soft: 0 4px 20px -4px hsl(0, 0%, 0%, 0.25);
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 300;
            line-height: 1.6;
            background: var(--background);
            color: var(--foreground);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 256px;
            background-color: var(--sidebar-background);
            border-right: 1px solid var(--sidebar-border);
            padding-top: 80px;
            transition: var(--transition-smooth);
            z-index: 30;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: hsl(from var(--sidebar-foreground) h s l / 0.7);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .nav-item:hover {
            background-color: var(--sidebar-accent);
            color: var(--sidebar-foreground);
        }

        .nav-item.active {
            background-color: var(--sidebar-accent);
            color: var(--sidebar-accent-foreground);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
        }

        .header {
            position: fixed;
            left: 256px;
            right: 0;
            top: 0;
            z-index: 40;
            background-color: hsl(from var(--background) h s l / 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid hsl(from var(--border) h s l / 0.5);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            padding: 0 32px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-dot {
            width: 16px;
            height: 16px;
            background-color: var(--primary-foreground);
            border-radius: 50%;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: -0.025em;
        }

        .profile-dropdown {
            position: relative;
        }

        .profile-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary);
            color: var(--primary-foreground);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 500;
            transition: var(--transition-smooth);
        }

        .profile-button:hover {
            transform: scale(1.05);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-elegant);
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
            z-index: 50;
            overflow: hidden;
        }

        .dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--foreground);
            text-decoration: none;
            font-size: 0.875rem;
            transition: var(--transition-smooth);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .dropdown-item:hover {
            background-color: var(--muted);
        }

        .dropdown-icon {
            width: 16px;
            height: 16px;
        }

        .main-content {
            margin-left: 256px;
            padding-top: 64px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 48px 32px;
        }

        .page-header {
            margin-bottom: 48px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-title {
            font-size: clamp(2.5rem, 5vw, 3rem);
            font-weight: 300;
            letter-spacing: -0.025em;
            margin-bottom: 16px;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }

        .page-description {
            font-size: 1.25rem;
            color: var(--muted-foreground);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 999px;
            background-color: var(--primary);
            color: var(--primary-foreground);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .categories {
            display: flex;
            gap: 12px;
            margin-bottom: 48px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: 1px solid var(--border);
            background-color: var(--card);
            color: var(--foreground);
        }

        .category-btn:hover {
            background-color: var(--muted);
        }

        .category-btn.active {
            background-color: var(--primary);
            color: var(--primary-foreground);
            border-color: var(--primary);
            box-shadow: var(--shadow-elegant);
        }

        .category-icon {
            width: 16px;
            height: 16px;
        }

        .category-count {
            margin-left: 4px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.75rem;
        }

        .category-btn.active .category-count {
            background-color: hsl(from var(--primary-foreground) h s l / 0.2);
        }

        .category-btn:not(.active) .category-count {
            background-color: var(--muted);
        }

        .suggestions-grid {
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(auto-fill, minmax(540px, 1fr));
        }

        .suggestion-card {
            background-color: hsl(from var(--card) h s l / 0.8);
            backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid hsl(from var(--border) h s l / 0.5);
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-soft);
            animation: fadeIn 0.5s ease-out;
        }

        .suggestion-card:hover {
            box-shadow: var(--shadow-elegant);
        }

        .card-header {
            display: flex;
            align-items: start;
            margin-bottom: 16px;
        }

        .card-title-section {
            flex: 1;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: -0.025em;
            transition: var(--transition-smooth);
        }

        .suggestion-card:hover .card-title {
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .trending-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 999px;
            background-color: hsl(from var(--accent) h s l / 0.2);
            color: var(--accent-foreground);
            font-size: 0.75rem;
        }

        .card-author {
            color: var(--muted-foreground);
            font-size: 0.875rem;
        }

        .match-score {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .match-value {
            font-size: 2rem;
            font-weight: 300;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .match-label {
            font-size: 0.75rem;
            color: var(--muted-foreground);
        }

        .reason-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
            background-color: hsl(from var(--muted) h s l / 0.5);
            font-size: 0.875rem;
            color: var(--muted-foreground);
            margin-bottom: 16px;
        }

        .card-excerpt {
            color: hsl(from var(--foreground) h s l / 0.8);
            line-height: 1.5;
            font-size: 0.875rem;
            margin-bottom: 16px;
        }

        .card-meta {
            display: flex;
            align-items: center;
            font-size: 0.75rem;
            color: var(--muted-foreground);
            margin-bottom: 16px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-decoration: none;
            text-align: center;
            font-family: 'Inter', sans-serif;
        }

        .btn-outline {
            background-color: var(--background);
            color: var(--foreground);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background-color: var(--muted);
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--primary-foreground);
        }

        .btn-primary:hover {
            transform: scale(1.05);
        }

        .load-more {
            display: flex;
            justify-content: center;
            margin-top: 48px;
        }

        .load-more-btn {
            padding: 12px 32px;
            border-radius: var(--radius);
            background-color: var(--card);
            border: 1px solid var(--border);
            color: var(--foreground);
            cursor: pointer;
            transition: var(--transition-smooth);
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .load-more-btn:hover {
            background-color: var(--muted);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 24px;
            box-shadow: var(--shadow-elegant);
            z-index: 200;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            min-width: 300px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-title {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .toast-description {
            font-size: 0.875rem;
            color: var(--muted-foreground);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .header {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .suggestions-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 32px 16px;
            }
        }
    </style>
</head>

                reason: "Readers like you enjoyed this",
                excerpt: "An ancient library appears only at midnight, containing books that write themselves based on the reader's deepest desires.",
                readTime: "22 min",
                trending: false,
                match: 92
            },
            {
                title: "Echoes of Atlantis",
                author: "Marina Delacroix",
                reason: "Similar to 'The Last Garden'",
                excerpt: "Beneath the ocean waves, an underwater civilization holds the key to humanity's future, but time is running out.",
                readTime: "25 min",
                trending: true,
                match: 89
            },
            {
                title: "The Memory Thief",
                author: "Viktor Petrov",
                reason: "Perfect for your reading history",
                excerpt: "A detective who can steal memories to solve crimes faces his greatest challenge when his own past is stolen.",
                readTime: "16 min",
                trending: false,
                match: 88
            },
            {
                title: "Starlight Symphony",
                author: "Luna Martinez",
                reason: "Trending in your genres",
                excerpt: "Each star sings a unique song, and one astronomer discovers they're trying to warn us about something approaching.",
                readTime: "20 min",
                trending: true,
                match: 86
            },
            {
                title: "The Chrono Café",
                author: "Benjamin Wong",
                reason: "New release recommendation",
                excerpt: "A café where time flows differently in each booth, allowing patrons to relive moments or glimpse futures.",
                readTime: "14 min",
                trending: false,
                match: 85
            }
        ];

        function renderSuggestions() {
            const grid = document.getElementById('suggestionsGrid');
            grid.innerHTML = suggestions.map(suggestion => `
                <div class="suggestion-card">
                    <div class="card-header">
                        <div class="card-title-section">
                            <div class="card-title-row">
                                <h3 class="card-title">${suggestion.title}</h3>
                                ${suggestion.trending ? `
                                    <span class="trending-badge">
                                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                                        </svg>
                                        Trending
                                    </span>
                                ` : ''}
                            </div>
                            <p class="card-author">by ${suggestion.author}</p>
                        </div>
                        <div class="match-score">
                            <div class="match-value">${suggestion.match}%</div>
                            <div class="match-label">match</div>
                        </div>
                    </div>

                    <div class="reason-badge">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
                        </svg>
                        ${suggestion.reason}
                    </div>

                    <p class="card-excerpt">${suggestion.excerpt}</p>

                    <div class="card-meta">
                        <span class="meta-item">
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            ${suggestion.readTime} read
                        </span>
                    </div>

                    <div class="card-buttons">
                        <button class="btn btn-outline" onclick="addToList('${suggestion.title}')">Add to List</button>
                        <button class="btn btn-primary" onclick="startReading('${suggestion.title}')">Start Reading</button>
                    </div>
                </div>
            `).join('');
        }

        renderSuggestions();

        function selectCategory(element) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            const categoryName = element.querySelector('span').textContent;
            showToast('Category Selected', `Showing ${categoryName} suggestions`);
        }

        function addToList(title) {
            showToast('Added to Reading List', `${title} has been added to your reading list.`);
        }

        function startReading(title) {
            showToast('Opening Story', `Starting ${title}...`);
        }

        function loadMore() {
            showToast('Loading', 'Loading more suggestions...');
        }

        function toggleProfileDropdown() {
            const dropdown = document.getElementById('profileDropdown');
            dropdown.classList.toggle('active');
        }

        function viewProfile() {
            showToast('Profile', 'Navigating to your profile...');
            toggleProfileDropdown();
            window.location.href = '/profile';
        }

        async function logout() {
            try{
                const res = await fetch('/logout', {
                method: 'GET',
                credentials: 'include'
                });
                if (res.ok) {
                    showToast('Logged Out','You have been successfully logged out.');
                    toggleProfileDropdown();
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                }
                } catch (err) {
                        showToast('Error','Something went wrong while logging out.');
                    }
        }

        function showToast(title, description) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toastTitle');
            const toastDescription = document.getElementById('toastDescription');
            
            toastTitle.textContent = title;
            toastDescription.textContent = description;
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('profileDropdown');
            const profileButton = document.querySelector('.profile-button');
            
            if (!profileButton.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.classList.remove('active');
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                document.getElementById('profileDropdown').classList.remove('active');
            }
        });
    </script>
</body>
</html>
