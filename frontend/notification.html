<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - EchoTales</title>
    <meta name="description" content="Stay updated with your story interactions and achievements">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: hsl(0, 0%, 8%);
            --foreground: hsl(250, 40%, 95%);
            --card: hsl(0, 0%, 12%);
            --card-foreground: hsl(250, 40%, 95%);
            --primary: hsl(250, 40%, 95%);
            --primary-foreground: hsl(0, 0%, 8%);
            --secondary: hsl(0, 0%, 15%);
            --secondary-foreground: hsl(250, 40%, 95%);
            --muted: hsl(180, 50%, 25%);
            --muted-foreground: hsl(0, 0%, 65%);
            --accent: hsl(180, 50%, 25%);
            --accent-foreground: hsl(250, 40%, 95%);
            --border: hsl(0, 0%, 18%);
            --sidebar-background: hsl(0, 0%, 10%);
            --sidebar-foreground: hsl(250, 40%, 90%);
            --sidebar-border: hsl(0, 0%, 15%);
            --sidebar-accent: hsl(0, 0%, 15%);
            --sidebar-accent-foreground: hsl(250, 40%, 95%);
            --radius: 12px;
            --gradient-text: linear-gradient(135deg, hsl(250, 40%, 95%) 0%, hsl(35, 85%, 55%) 50%, hsl(180, 80%, 55%) 100%);
            --shadow-elegant: 0 10px 50px -10px hsl(0, 0%, 0%, 0.4);
            --shadow-soft: 0 4px 20px -4px hsl(0, 0%, 0%, 0.25);
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 300;
            line-height: 1.6;
            background: var(--background);
            color: var(--foreground);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 256px;
            background-color: var(--sidebar-background);
            border-right: 1px solid var(--sidebar-border);
            padding-top: 80px;
            transition: var(--transition-smooth);
            z-index: 30;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: hsl(from var(--sidebar-foreground) h s l / 0.7);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .nav-item:hover {
            background-color: var(--sidebar-accent);
            color: var(--sidebar-foreground);
        }

        .nav-item.active {
            background-color: var(--sidebar-accent);
            color: var(--sidebar-accent-foreground);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
        }

        .header {
            position: fixed;
            left: 256px;
            right: 0;
            top: 0;
            z-index: 40;
            background-color: hsl(from var(--background) h s l / 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid hsl(from var(--border) h s l / 0.5);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            padding: 0 32px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-dot {
            width: 16px;
            height: 16px;
            background-color: var(--primary-foreground);
            border-radius: 50%;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: -0.025em;
        }

        .profile-dropdown {
            position: relative;
        }

        .profile-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary);
            color: var(--primary-foreground);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 500;
            transition: var(--transition-smooth);
        }

        .profile-button:hover {
            transform: scale(1.05);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-elegant);
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
            z-index: 50;
            overflow: hidden;
        }

        .dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--foreground);
            text-decoration: none;
            font-size: 0.875rem;
            transition: var(--transition-smooth);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .dropdown-item:hover {
            background-color: var(--muted);
        }

        .dropdown-icon {
            width: 16px;
            height: 16px;
        }

        .main-content {
            margin-left: 256px;
            padding-top: 64px;
        }

        .container {
            max-width: 1024px;
            margin: 0 auto;
            padding: 48px 32px;
        }

        .page-header {
            margin-bottom: 48px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-top {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            justify-content: space-between;
        }

        .page-title {
            font-size: clamp(2.5rem, 5vw, 3rem);
            font-weight: 300;
            letter-spacing: -0.025em;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }

        .mark-all-btn {
            padding: 8px 16px;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            background-color: var(--primary);
            color: var(--primary-foreground);
            border: none;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .mark-all-btn:hover {
            transform: scale(1.05);
        }

        .header-bottom {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .page-description {
            font-size: 1.25rem;
            color: var(--muted-foreground);
        }

        .unread-badge {
            padding: 4px 12px;
            border-radius: 999px;
            background-color: var(--primary);
            color: var(--primary-foreground);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
        }

        .filter-tab {
            padding: 10px 20px;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: 1px solid var(--border);
            background-color: var(--card);
            color: var(--foreground);
        }

        .filter-tab:hover {
            background-color: var(--muted);
        }

        .filter-tab.active {
            background-color: var(--primary);
            color: var(--primary-foreground);
            border-color: var(--primary);
        }

        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notification-card {
            background-color: hsl(from var(--card) h s l / 0.8);
            backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid hsl(from var(--border) h s l / 0.5);
            transition: var(--transition-smooth);
            cursor: pointer;
            animation: fadeIn 0.5s ease-out;
        }

        .notification-card:hover {
            border-color: var(--border);
        }

        .notification-card.unread {
            border-color: hsl(from var(--primary) h s l / 0.5);
            box-shadow: var(--shadow-soft);
        }

        .notification-card.unread:hover {
            box-shadow: var(--shadow-elegant);
        }

        .notification-content {
            display: flex;
            gap: 16px;
        }

        .notification-icon {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: hsl(from var(--muted) h s l / 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification-icon svg {
            width: 24px;
            height: 24px;
        }

        .notification-icon.like {
            color: hsl(0, 70%, 60%);
        }

        .notification-icon.comment {
            color: hsl(210, 70%, 60%);
        }

        .notification-icon.follow {
            color: hsl(140, 70%, 50%);
        }

        .notification-icon.achievement {
            color: hsl(45, 90%, 60%);
        }

        .notification-icon.reminder {
            color: hsl(270, 60%, 65%);
        }

        .notification-icon.update {
            color: hsl(180, 60%, 60%);
        }

        .notification-body {
            flex: 1;
            min-width: 0;
        }

        .notification-header {
            display: flex;
            align-items: start;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .notification-title {
            font-size: 1rem;
            font-weight: 500;
        }

        .notification-card.unread .notification-title {
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--primary);
            flex-shrink: 0;
        }

        .notification-message {
            font-size: 0.875rem;
            color: hsl(from var(--foreground) h s l / 0.8);
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .notification-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .notification-time {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: var(--muted-foreground);
        }

        .notification-time svg {
            width: 12px;
            height: 12px;
        }

        .view-btn {
            padding: 6px 12px;
            border-radius: var(--radius);
            font-size: 0.75rem;
            font-weight: 500;
            background-color: var(--background);
            border: 1px solid var(--border);
            color: var(--foreground);
            cursor: pointer;
            transition: var(--transition-smooth);
            opacity: 0;
        }

        .notification-card:hover .view-btn {
            opacity: 1;
        }

        .view-btn:hover {
            background-color: var(--muted);
        }

        .empty-state {
            text-align: center;
            padding: 64px 0;
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            color: hsl(from var(--muted-foreground) h s l / 0.5);
        }

        .empty-title {
            font-size: 1.25rem;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .empty-description {
            color: var(--muted-foreground);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 24px;
            box-shadow: var(--shadow-elegant);
            z-index: 200;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            min-width: 300px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-title {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .toast-description {
            font-size: 0.875rem;
            color: var(--muted-foreground);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .header {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .container {
                padding: 32px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <a href="/" class="nav-item">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>

            </a>
            <a href="/explore" class="nav-item">

            </a>

                </svg>
                <span>Suggestions</span>
            </a>
            <a href="/notification" class="nav-item active">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>

        </nav>
    </aside>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <div class="logo-dot"></div>
                </div>
                <span class="logo-text">EchoTales</span>
            </div>

            <div class="profile-dropdown">
                <button class="profile-button" onclick="toggleProfileDropdown()">
                    U
                </button>
                <div id="profileDropdown" class="dropdown-menu">
                    <button class="dropdown-item" onclick="viewProfile()">
                        <svg class="dropdown-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <span>View Profile</span>
                    </button>
                    <button class="dropdown-item" onclick="logout()">
                        <svg class="dropdown-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        <span>Log Out</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <div class="header-top">
                    <h1 class="page-title">Notifications</h1>
                    <button class="mark-all-btn" id="markAllBtn" onclick="markAllAsRead()" style="display: none;">
                        Mark all as read
                    </button>
                </div>
                <div class="header-bottom">
                    <p class="page-description">
                        Stay updated with your story interactions and achievements
                    </p>
                    <span class="unread-badge" id="unreadBadge"></span>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterNotifications('unread')">
                    Unread (<span id="unreadCount">0</span>)
                </button>
            </div>

            <div class="notifications-list" id="notificationsList">
                <!-- Notifications will be rendered here -->
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
                <h3 class="empty-title">No notifications</h3>
                <p class="empty-description" id="emptyDescription">Check back later for updates</p>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div class="toast-title" id="toastTitle"></div>
        <div class="toast-description" id="toastDescription"></div>
    </div>

    <script>
        let notifications = [
            {
                id: 1,
                type: "like",
                title: "New Reaction",
                message: "Sarah Williams loved your story 'Midnight Reverie'",
                time: "2 min ago",
                read: false,
                actionable: true
            }
        ];

        let currentFilter = 'unread';

        const iconMap = {
            like: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>',
            comment: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>',
            follow: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>',
            achievement: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>',
            reminder: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>',
            update: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>'
        };

        function renderNotifications() {
            const list = document.getElementById('notificationsList');
            const emptyState = document.getElementById('emptyState');
            
            let filtered = notifications;
            if (currentFilter === 'unread') {
                filtered = notifications.filter(n => !n.read);
            }

            if (filtered.length === 0) {
                list.style.display = 'none';
                emptyState.style.display = 'block';
                document.getElementById('emptyDescription').textContent = 
                    currentFilter === 'unread' ? "You're all caught up!" : "Check back later for updates";
                return;
            }

            list.style.display = 'flex';
            emptyState.style.display = 'none';

            list.innerHTML = filtered.map((notification, index) => `
                <div class="notification-card ${notification.read ? '' : 'unread'}" 
                     onclick="markAsRead(${notification.id})"
                     style="animation-delay: ${index * 0.05}s">
                    <div class="notification-content">
                        <div class="notification-icon ${notification.type}">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                ${iconMap[notification.type]}
                            </svg>
                        </div>
                        <div class="notification-body">
                            <div class="notification-header">
                                <h3 class="notification-title">${notification.title}</h3>
                                ${!notification.read ? '<span class="unread-dot"></span>' : ''}
                            </div>
                            <p class="notification-message">${notification.message}</p>
                            <div class="notification-footer">
                                <span class="notification-time">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                    ${notification.time}
                                </span>
                                ${notification.actionable ? `
                                    <button class="view-btn" onclick="handleAction(event, ${notification.id})">View</button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            updateCounts();
        }

        function updateCounts() {
            const unreadCount = notifications.filter(n => !n.read).length;
            
            document.getElementById('unreadCount').textContent = unreadCount;
            
            const unreadBadge = document.getElementById('unreadBadge');
            const markAllBtn = document.getElementById('markAllBtn');
            
            if (unreadCount > 0) {
                unreadBadge.textContent = `${unreadCount} new`;
                unreadBadge.style.display = 'inline-block';
                markAllBtn.style.display = 'block';
            } else {
                unreadBadge.style.display = 'none';
                markAllBtn.style.display = 'none';
            }
        }

        function markAsRead(id) {
            const notification = notifications.find(n => n.id === id);
            if (notification && !notification.read) {
                notification.read = true;
                renderNotifications();
            }
        }

        function markAllAsRead() {
            notifications = notifications.map(n => ({ ...n, read: true }));
            renderNotifications();
            showToast('Success', 'All notifications marked as read');
        }

        function filterNotifications(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', filter === 'unread');
            });
            renderNotifications();
        }

        function handleAction(event, id) {
            event.stopPropagation();
            const notification = notifications.find(n => n.id === id);
            if (notification) {
                markAsRead(id);
                showToast('Action', `Opening ${notification.title.toLowerCase()}...`);
            }
        }

        function toggleProfileDropdown() {
            const dropdown = document.getElementById('profileDropdown');
            dropdown.classList.toggle('active');
        }

        function viewProfile() {
            showToast('Profile', 'Navigating to your profile...');
            toggleProfileDropdown();
            window.location.href = '/profile';
        }

        async function logout() {
            try{
                const res = await fetch('/logout', {
                method: 'GET',
                credentials: 'include'
                });
                if (res.ok) {
                    showToast('Logged Out','You have been successfully logged out.');
                    toggleProfileDropdown();
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                }
                } catch (err) {
                        showToast('Error','Something went wrong while logging out.');
                    }
        }

        function showToast(title, description) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toastTitle');
            const toastDescription = document.getElementById('toastDescription');
            
            toastTitle.textContent = title;
            toastDescription.textContent = description;
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('profileDropdown');
            const profileButton = document.querySelector('.profile-button');
            
            if (!profileButton.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.classList.remove('active');
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                document.getElementById('profileDropdown').classList.remove('active');
            }
        });

        // Initial render
        renderNotifications();
    </script>
</body>
</html>
