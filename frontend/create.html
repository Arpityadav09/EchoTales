<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Story - EchoTales</title>
    <meta name="description" content="Write and share your stories on EchoTales">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Core colors - Vibrant storytelling palette */
            --background: hsl(0, 0%, 8%);
                --foreground: hsl(250, 40%, 95%);
                --card: hsl(0, 0%, 12%);
                --card-foreground: hsl(250, 40%, 95%);
                --primary: hsl(250, 40%, 95%);
                --primary-foreground: hsl(0, 0%, 8%);
                --secondary: hsl(0, 0%, 15%);
                --secondary-foreground: hsl(250, 40%, 95%);
                --muted: hsl(180,50%,25%);
                --muted-foreground: hsl(0, 0%, 65%);
                --accent: hsl(180, 50%, 25%);
                --accent-foreground: hsl(250, 40%, 95%);
                --border: hsl(0, 0%, 18%);
                --input: hsl(0, 0%, 18%);
                --ring: hsl(250, 40%, 95%);
            
            /* Sidebar colors */
            --sidebar-background: hsl(0, 0%, 10%);
                --sidebar-foreground: hsl(250, 40%, 90%);
                --sidebar-border: hsl(0, 0%, 15%);
                --sidebar-accent: hsl(0, 0%, 15%);
                --sidebar-accent-foreground: hsl(250, 40%, 95%);

            --radius: 12px;
            --gradient-text: linear-gradient(135deg, hsl(250, 40%, 95%) 0%, hsl(35, 85%, 55%) 50%, hsl(180, 80%, 55%) 100%);
                --shadow-elegant: 0 10px 50px -10px hsl(0, 0%, 0%, 0.4);
                --shadow-soft: 0 4px 20px -4px hsl(0, 0%, 0%, 0.25);
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: hsl(0, 0%, 8%);
                --foreground: hsl(250, 40%, 95%);
                --card: hsl(0, 0%, 12%);
                --card-foreground: hsl(250, 40%, 95%);
                --primary: hsl(250, 40%, 95%);
                --primary-foreground: hsl(0, 0%, 8%);
                --secondary: hsl(0, 0%, 15%);
                --secondary-foreground: hsl(250, 40%, 95%);
                --muted: hsl(180,50%,25%);
                --muted-foreground: hsl(0, 0%, 65%);
                --accent: hsl(180, 50%, 25%);
                --accent-foreground: hsl(250, 40%, 95%);
                --border: hsl(0, 0%, 18%);
                --input: hsl(0, 0%, 18%);
                --ring: hsl(250, 40%, 95%);
                --gradient-text: linear-gradient(135deg, hsl(250, 40%, 95%) 0%, hsl(35, 85%, 55%) 50%, hsl(180, 80%, 55%) 100%);
                --shadow-elegant: 0 10px 50px -10px hsl(0, 0%, 0%, 0.4);
                --shadow-soft: 0 4px 20px -4px hsl(0, 0%, 0%, 0.25);
                --sidebar-background: hsl(0, 0%, 10%);
                --sidebar-foreground: hsl(250, 40%, 90%);
                --sidebar-border: hsl(0, 0%, 15%);
                --sidebar-accent: hsl(0, 0%, 15%);
                --sidebar-accent-foreground: hsl(250, 40%, 95%);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 300;
            line-height: 1.6;
            background: var(--background);
            color: var(--foreground);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 256px;
            background-color: var(--sidebar-background);
            border-right: 1px solid var(--sidebar-border);
            padding-top: 80px;
            transition: var(--transition-smooth);
            z-index: 30;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: hsl(from var(--sidebar-foreground) h s l / 0.7);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .nav-item:hover {
            background-color: var(--sidebar-accent);
            color: var(--sidebar-foreground);
        }

        .nav-item.active {
            background-color: var(--sidebar-accent);
            color: var(--sidebar-accent-foreground);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
        }

        /* Header */
        .header {
            position: fixed;
            left: 256px;
            right: 0;
            top: 0;
            z-index: 40;
            background-color: hsl(from var(--background) h s l / 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid hsl(from var(--border) h s l / 0.5);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            padding: 0 32px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-dot {
            width: 16px;
            height: 16px;
            background-color: var(--primary-foreground);
            border-radius: 50%;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: -0.025em;
        }

        /* Profile Dropdown */
        .profile-dropdown {
            position: relative;
        }

        .profile-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary);
            color: var(--primary-foreground);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 500;
            transition: var(--transition-smooth);
        }

        .profile-button:hover {
            transform: scale(1.05);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-elegant);
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
            z-index: 50;
            overflow: hidden;
        }

        .dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--foreground);
            text-decoration: none;
            font-size: 0.875rem;
            transition: var(--transition-smooth);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .dropdown-item:hover {
            background-color: var(--muted);
        }

        .dropdown-icon {
            width: 16px;
            height: 16px;
        }

        /* Main Content */
        .main-content {
            margin-left: 256px;
            padding-top: 64px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 48px 32px;
        }

        .page-header {
            margin-bottom: 48px;
        }

        .page-title {
            font-size: clamp(2.5rem, 5vw, 3rem);
            font-weight: 300;
            letter-spacing: -0.025em;
            margin-bottom: 16px;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }

        .page-description {
            font-size: 1.25rem;
            color: var(--muted-foreground);
        }

        /* Form Styles */
        .form-card {
            background-color: hsl(from var(--card) h s l / 0.8);
            backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 32px;
            border: 1px solid hsl(from var(--border) h s l / 0.5);
            box-shadow: var(--shadow-soft);
        }

        .form-group {
            margin-bottom: 32px;
        }

        .form-label {
            display: block;
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--foreground);
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            background-color: hsl(from var(--background) h s l / 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid hsl(from var(--border) h s l / 0.5);
            border-radius: var(--radius);
            color: var(--foreground);
            transition: var(--transition-smooth);
            font-family: 'Inter', sans-serif;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--ring);
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: var(--muted-foreground);
        }

        .form-input.large {
            height: 56px;
            font-size: 1.125rem;
        }

        .form-textarea {
            min-height: 400px;
            resize: vertical;
            line-height: 1.8;
        }

        .form-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--muted-foreground);
            margin-top: 8px;
        }

        /* Genre Tags */
        .genres-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .genre-tag {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: 1px solid var(--border);
            background-color: var(--background);
            color: var(--foreground);
        }

        .genre-tag:hover {
            background-color: var(--muted);
        }

        .genre-tag.active {
            background-color: var(--primary);
            color: var(--primary-foreground);
            border-color: var(--primary);
        }

        /* Audio Upload */
        .upload-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .upload-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background-color: var(--secondary);
            color: var(--secondary-foreground);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition-smooth);
            font-family: 'Inter', sans-serif;
        }

        .upload-button:hover {
            background-color: hsl(from var(--secondary) h s calc(l * 0.8));
        }

        .upload-icon {
            width: 20px;
            height: 20px;
        }

        .file-name {
            font-size: 0.875rem;
            color: var(--muted-foreground);
        }

        /* Buttons */
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding-top: 24px;
        }

        .btn {
            flex: 1;
            min-width: 140px;
            padding: 14px 24px;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-decoration: none;
            text-align: center;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-outline {
            background-color: var(--background);
            color: var(--foreground);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background-color: var(--muted);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: var(--secondary-foreground);
        }

        .btn-secondary:hover {
            background-color: hsl(from var(--secondary) h s calc(l * 0.8));
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--primary-foreground);
        }

        .btn-primary:hover {
            transform: scale(1.05);
        }

        .btn-icon {
            width: 20px;
            height: 20px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 24px;
            box-shadow: var(--shadow-elegant);
            z-index: 200;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            min-width: 300px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-title {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .toast-description {
            font-size: 0.875rem;
            color: var(--muted-foreground);
        }
        .nav-logo {

color: hsl(from var(--sidebar-foreground) h s l / 0.7);
text-decoration: none;
}

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .header {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .container {
                padding: 32px 16px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <a href="/" class="nav-item">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="/explore" class="nav-item">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                </svg>
                <span>Explore</span>
            </a>
            <a href="#" class="nav-item active">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
                <span>Create</span>
            </a>
            <a href="/suggestion" class="nav-item">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
                <span>Suggestions</span>
            </a>
            <a href="/notification" class="nav-item">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
                <span>Notifications</span>
            </a>
            <a href="#" class="nav-item">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <span>Settings</span>
            </a>
        </nav>
    </aside>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="/" class="nav-logo">
                <div class="logo">
                    <div class="logo-icon">
                        <div class="logo-dot"></div>
                    </div>
                    <span class="logo-text">EchoTales</span>
                </div>
                </a>

            <div class="profile-dropdown">
                <button class="profile-button" onclick="toggleProfileDropdown()">
                    U
                </button>
                <div id="profileDropdown" class="dropdown-menu">
                    <button class="dropdown-item" onclick="viewProfile()">
                        <svg class="dropdown-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <span>View Profile</span>
                    </button>
                    <button class="dropdown-item" onclick="logout()">
                        <svg class="dropdown-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        <span>Log Out</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">Create Your Story</h1>
                <p class="page-description">Share your imagination with the world</p>
            </div>

            <div class="form-card">
                <form id="storyForm">
                    <!-- Title -->
                    <div class="form-group">
                        <label for="title" class="form-label">Story Title</label>
                        <input 
                            type="text" 
                            id="title" 
                            class="form-input large"
                            placeholder="Enter your story title..."
                            required
                        >
                    </div>

                    <!-- Author -->
                    <div class="form-group">
                        <label for="author" class="form-label">Author Name</label>
                        <input 
                            type="text" 
                            id="authorName" 
                            class="form-input"
                            placeholder="Your name..."
                            required
                        >
                    </div>

                    <!-- Genres -->
                    <div class="form-group">
                        <label class="form-label">Genres</label>
                        <div class="genres-container" id="genresContainer">
                            <div class="genre-tag" data-genre="Sci-Fi">Sci-Fi</div>
                            <div class="genre-tag" data-genre="Fantasy">Fantasy</div>
                            <div class="genre-tag" data-genre="Mystery">Mystery</div>
                            <div class="genre-tag" data-genre="Romance">Romance</div>
                            <div class="genre-tag" data-genre="Thriller">Thriller</div>
                            <div class="genre-tag" data-genre="Adventure">Adventure</div>
                            <div class="genre-tag" data-genre="Horror">Horror</div>
                            <div class="genre-tag" data-genre="Drama">Drama</div>
                        </div>
                    </div>

                    <!-- Story Content -->
                    <div class="form-group">
                        <label for="content" class="form-label">Story Content</label>
                        <textarea 
                            id="content" 
                            class="form-textarea"
                            placeholder="Once upon a time..."
                            required
                        ></textarea>
                        <div class="form-meta">
                            <span id="wordCount">0 words</span>
                            <span id="readingTime">0 min read</span>
                        </div>
                    </div>

                    
                    <!-- Action Buttons -->
                    <div class="button-group">
                        <button type="button" class="btn btn-outline" onclick="previewStory()">
                            <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            Preview
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="saveDraft()">
                            <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
                            </svg>
                            Save Draft
                        </button>
                        <button type="submit" class="btn btn-primary">
                            Publish Story
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div class="toast-title" id="toastTitle"></div>
        <div class="toast-description" id="toastDescription"></div>
    </div>

    <script>
        // State management
        let selectedGenres = [];
        
        // Genre selection
        document.querySelectorAll('.genre-tag').forEach(tag => {
            tag.addEventListener('click', function() {
                const genre = this.dataset.genre;
                this.classList.toggle('active');
                
                if (selectedGenres.includes(genre)) {
                    selectedGenres = selectedGenres.filter(g => g !== genre);
                } else {
                    selectedGenres.push(genre);
                }
            });
        });

        // Word count and reading time calculation
        const contentTextarea = document.getElementById('content');
        const wordCountEl = document.getElementById('wordCount');
        const readingTimeEl = document.getElementById('readingTime');

        contentTextarea.addEventListener('input', function() {
            const text = this.value.trim();
            const words = text.split(/\s+/).filter(word => word.length > 0);
            const wordCount = words.length;
            const readingTime = Math.ceil(wordCount / 200) || 0;

            wordCountEl.textContent = `${wordCount} words`;
            readingTimeEl.textContent = `${readingTime} min read`;
        });

        // Form submission
        document.getElementById('storyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            publishStory();
        });

        // Actions
        function previewStory() {
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const content = document.getElementById('content').value;

            if (!title || !author || !content) {
                showToast('Missing Information', 'Please fill in title, author, and story content.', true);
                return;
            }

            showToast('Preview Mode', 'Opening story preview...');
        }

        function saveDraft() {
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const content = document.getElementById('content').value;

            if (!title || !author || !content) {
                showToast('Missing Information', 'Please fill in title, author, and story content.', true);
                return;
            }

            // Here you would typically save to localStorage or send to a server
            showToast('Story Saved', 'Your story has been saved as a draft.');
        }

        async function publishStory() {
    const title = document.getElementById('title').value.trim();
    const authorName = document.getElementById('authorName').value.trim();
    const content = document.getElementById('content').value.trim();

    if (!title || !authorName || !content) {
        showToast('Missing Information', 'Please fill in title, author, and story content.', true);
        return;
    }

    try {
        const res = await fetch('/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title,
                authorName,
                content,
                genres: selectedGenres // array of strings
            }),
            credentials: 'include'
        });

        const data = await res.json();

        if (res.ok) {
            showToast('Story Published', 'Your story is now live on EchoTales!');
            document.getElementById('storyForm').reset();
            selectedGenres = [];
            
            setTimeout(() => {
                window.location.href = '/explore';
            }, 3000);
        } else {
            showToast('Error', data.message || 'Something went wrong.', true);
        }
    } catch (err) {
        showToast('Error', 'Failed to publish story.', true);
    }
}


        // Profile dropdown
        function toggleProfileDropdown() {
            const dropdown = document.getElementById('profileDropdown');
            dropdown.classList.toggle('active');
        }

        function viewProfile() {
            showToast('Profile', 'Navigating to your profile...');
            toggleProfileDropdown();
            window.location.href = '/profile';
        }

        async function logout() {
            try{
                const res = await fetch('/logout', {
                method: 'GET',
                credentials: 'include'
                });
                if (res.ok) {
                    showToast('Logged Out','You have been successfully logged out.');
                    toggleProfileDropdown();
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                }
                } catch (err) {
                        showToast('Error','Something went wrong while logging out.');
                    }
        }

        // Toast notification
        function showToast(title, description, isError = false) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toastTitle');
            const toastDescription = document.getElementById('toastDescription');
            
            toastTitle.textContent = title;
            toastDescription.textContent = description;
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('profileDropdown');
            const profileButton = document.querySelector('.profile-button');
            
            if (!profileButton.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.classList.remove('active');
            }
        });

        // Close dropdown with Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                document.getElementById('profileDropdown').classList.remove('active');
            }
        });
    </script>
</body>
</html>
